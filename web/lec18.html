<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #ffe9f4;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
p{
    
}
img {
  max-width: 100%;
}

a {
  text-decoration: none;
  display: inline-block;
}

.container {
  width: 80%;
  margin: 0 auto;
}

form {
  width: 400px;
  background-color: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(255, 187, 221, 0.6);
}

form h2 {
  margin-top: 0;
  font-size: 20px;
  text-align: center;
}

form div {
  margin-bottom: 15px;
}

form input,
form button {
  display: block;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #ccc;
  outline: 0;
  border-radius: 3px;
}

form input:focus {
  border-color: #ff57ab;
}

form button {
  background-color: #ff57ab;
  color: #fff;
  border: 1px solid #ff57ab;
  cursor: pointer;
  transition: all .3s ease;
}

form button:hover {
  background-color: transparent;
  color: #ff57ab;
}

.pass-wrapper {
  position: relative;
}

.pass-wrapper i {
  position: absolute;
  right: 8px;
  top:  28px;
  cursor: pointer;
}
  </style>
</head>

<body>
/
  <form action="">
    <h2>Welcome Back, Login Again</h2>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="pass-wrapper">
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
      <p style="display: none; color: red;">the password lazem be at least 8 letters</p>
      <i class="far fa-eye"></i>
      
    </div>
    <button>Login</button>
  </form>

  
</body>
<script>
    const pass = document.getElementById('password');
    const icon = document.querySelector('.pass-wrapper i');
    const btn = document.querySelector('form button');
 
    function notclick() {
        pass.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
    icon.addEventListener('mousedown', () => {
        pass.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    });
    icon.addEventListener('mouseup', notclick);
    icon.addEventListener('mouseleave', notclick);
    btn.addEventListener('click', (e) => {
        if (pass.value.length < 8) {
            e.preventDefault();
            document.querySelector('.pass-wrapper p').style.display = 'block';

            return;
        }
        else {
            document.querySelector('.pass-wrapper p').style.color = 'green';
            document.querySelector('.pass-wrapper p').innerHTML = 'Mabrook, you logged in successfully';
            e.preventDefault();
        }
        
        
    });
</script>
</html>
