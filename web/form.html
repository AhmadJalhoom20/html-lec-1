<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input,select{
        width: 250px;
        height: 50px;
    }
    button{
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px auto;
            max-width: 400px;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
    }
    button:hover{
        scale: 1.1;
    }
    button:active{
        rotate: 15deg;
    }
</style>
<body>
    
    <form action="" method="get">

        <fieldset style="height: 40vh;">
            <legend><h1>Login لصفحة بطاطا🥔</h1></legend>


                <input type="text" name="name" id="" placeholder="ur name" autofocus autocomplete="Ahmad" required>
                <br>
                <br>
                <input type="number" name="age" id="" minlength="1" maxlength="2" placeholder="Ur Age" required>
                <br>
                <br>
                <input type="number" name="hawiya" id="" placeholder="Ur Hawiya" required autocomplete="">

           </fieldset>
           <br>

           <fieldset style="height: 30vh;">
            <legend>Ur Jop</legend>

                <select name="Jop" id="" required>
                    <option value="" selected disabled>  ---  Choose Ur Jop  ---  </option>
                    <option value="Software">SoftWare Eng</option>
                    <option value="Frontend">FrontEnd</option>
                    <option value="Backend">BackEnd</option>
                    <option value="Mobile Dev">Mobile Dev</option>
                </select>
                <br>
                <br>
                <br>
                <textarea name="bio" id="" placeholder="Bio" style="max-width: 500px; max-height: 180px;" ></textarea>

           </fieldset>

           <button>Register/Login</button>

    </form>
    
</body>
</html>
