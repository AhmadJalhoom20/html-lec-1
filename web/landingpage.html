    <style>
   

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
  }

body {
background: linear-gradient(135deg, #0f172a, #1e3a8a);
color: white;
}

/* NAVBAR ya rami */
nav {
position: fixed;
top: 0;
width: 100%;
height: 70px;
display: flex;
justify-content: space-between;
align-items: center;
padding: 0 50px;
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.1);
z-index: 1000;
}

nav h2 {
cursor: pointer;
transition: 0.3s;
}

nav h2:hover {
color: #38bdf8;
transform: translateY(-2px);
}

nav img {
height: 40px;
}

/* alHERO ya raami */
.hero {
width: 100%;
height: 100vh;
position: relative;
overflow: hidden;
}

.hero img {
width: 100%;
height: 100%;
object-fit: cover;
filter: brightness(0.6);
}

/* khalid */
.hero::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(to top, rgba(15,23,42,1), rgba(15,23,42,0.2));
}

/* FOOTER rami u know */
.footer {
height: 120px;
background: rgba(0,0,0,0.6);
backdrop-filter: blur(10px);
display: flex;
justify-content: center;
gap: 30px;
align-items: center;
}

/* ICONS ya rami yasta */
.fa {
padding: 18px;
font-size: 20px;
width: 50px;
text-align: center;
border-radius: 50%;
transition: 0.3s;
color: white;
}

/* brand colors rami */
.fa-facebook { background: #1877f2; }
.fa-twitter { background: #1da1f2; }
.fa-linkedin { background: #0a66c2; }

/* hover effect ya rami */
.fa:hover {
transform: translateY(-8px) scale(1.1);
box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* hero ya rami*/
.hero {
margin-top: 70px;
}

    </style>
</head>
  <body>
    <nav>
      <img src="images/ahmad.png" alt="test" />

      <h2>Ahmad</h2>
      <h2>Test1</h2>
      <h2>Test2</h2>
    </nav>

    <div class="hero">
      <img src="images/hero.png" alt="Hero Image" />
    </div>
    <div class="footer">
      <a href="#no_facebook" class="fa fa-facebook"></a>
      <a href="#no_twitter" class="fa fa-twitter"></a>
      <a href="#no_linkedin" class="fa fa-linkedin"></a>
    </div>
  </body>
